# =====================================================================
#  Auto-Deploy auf den Duck-DNS-Server via SSH + rsync
# ---------------------------------------------------------------------
#  Voraussetzungen (GitHub → Settings → Secrets and variables → Actions):
#    SSH_HOST       z. B. schulwissen-labyrinth.duckdns.org
#    SSH_PORT       22 (oder dein eigener)
#    SSH_USER       z. B. deploy
#    SSH_KEY        Privater SSH-Key (ed25519), Inhalt der id_ed25519
#    DEPLOY_PATH    Zielordner auf dem Server, z. B. /srv/labyrinth/dist
#
#  Auf dem Server:
#    • Pubkey des CI-Users in ~/.ssh/authorized_keys
#    • DEPLOY_PATH gehört dem SSH_USER (chown)
#    • docker compose oben in deploy/ läuft und mountet diesen Ordner
# =====================================================================
name: Deploy to Duck DNS server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: duckdns-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DUCKDNS_DEPLOY == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync dist/ to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            ./dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
